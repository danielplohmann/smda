version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # smda is a library: a lower bound is a requirement put on every downstream install, so it
    # moves only when a range no longer admits the latest release, never just because one shipped
    versioning-strategy: increase-if-necessary
    # a yanked or compromised release is usually caught within days, and nothing here needs a
    # dependency the day it ships; Dependabot exempts security updates from cooldown, so an
    # advisory still arrives immediately
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # ty is pinned in pyproject.toml and ships new error rules in patch releases;
      # bump it in a dedicated change that addresses those rules, not via Dependabot.
      - dependency-name: "ty"
      # capstone<6 is a deliberate bound; its rationale is at the pin in pyproject.toml.
      # 6.x is a port, not a bump, so a weekly PR proposing it is noise.
      - dependency-name: "capstone"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # the same cooldown as pip, so the ruff-pre-commit rev and the `ruff==` pin in pyproject.toml
    # become eligible on the same day and arrive as a pair rather than a week apart
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"
