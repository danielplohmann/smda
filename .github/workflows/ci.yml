name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff linting
        run: python -m ruff check .

      - name: Run ruff formatting check
        run: python -m ruff format --check .

      # tests/ is deliberately absent: it carries ~187 diagnostics and needs its own pass.
      # The CI scripts are included because evaluate_runtime.py gates the perf benchmark
      # and was checked by nothing but its own tests.
      - name: Run ty type checking
        run: python -m ty check src/smda/ fuzzing/ profiling/ .github/workflows/scripts/

      - name: Sibling-pair check (advisory)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python .github/workflows/scripts/sibling_check.py

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # 3.14 is pre-release; report but do not block PRs on it.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux carries the full interpreter range; Windows and macOS run the floor
        # version only, to catch path/encoding portability without tripling the matrix.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history so the diff-coverage step below can resolve the base branch
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        run: python -m pytest tests/test*

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          set +e
          python -m pytest --cov=smda --cov-branch --cov-report=xml --cov-report=term-missing tests/ 2>&1 | tee coverage-summary.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Coverage"
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # coverage measures `source = ["smda"]`, so this gate only sees changed lines
      # under src/smda/**; tests/, fuzzing/ and scripts/ pass it by not being measured
      - name: Check diff coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        env:
          COMPARE_BRANCH: origin/${{ github.event.repository.default_branch }}
        run: |
          set +e
          diff-cover coverage.xml --compare-branch="$COMPARE_BRANCH" --fail-under=100 2>&1 | tee diff-coverage.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Diff coverage"
            echo
            echo '```text'
            cat diff-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  mcrit-install:
    name: MCRIT install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # 3.14 is pre-release; report but do not block PRs on it.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SMDA and MCRIT
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mcrit

      - name: Verify MCRIT imports with this SMDA checkout
        run: |
          python -c "import importlib.metadata; import mcrit; import smda; from smda.common.SmdaFunction import SmdaFunction; print(f'mcrit={importlib.metadata.version(\"mcrit\")}'); print(f'smda={importlib.metadata.version(\"smda\")}'); print(f'smda_module={smda.__file__}'); print(f'mcrit_module={mcrit.__file__}'); print(f'smda_function={SmdaFunction.__name__}')"
