name: Fuzzing

on:
  push:
    branches: [master]
    paths:
      - "fuzzing/**"
      - "src/smda/**"
      - ".github/workflows/fuzzing.yml"
  pull_request:
    paths:
      - "fuzzing/**"
      - "src/smda/**"
      - ".github/workflows/fuzzing.yml"
  schedule:
    # Scheduled workflows do not run in forks unless explicitly re-enabled, so
    # no repository guard is needed here.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds of fuzzing per target"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # atheris ships manylinux x86_64 wheels only; pinned so a release cannot
  # silently change instrumentation or drop the Python version used here.
  ATHERIS_VERSION: "3.1.0"

jobs:
  # Each target reaches one region of the tree — the loaders, the report model, the
  # synthesizers, the backends — so a pull request that touches none of a target's region
  # can only re-fuzz code it did not change. The harness, the workflow and anything shared
  # (top-level modules, smda.common) rebuild the whole matrix. Non-PR events fuzz everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any: ${{ steps.filter.outputs.any }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Select fuzz targets
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Everything every target reaches: the harness itself, the workflow, the top-level
          # modules and smda.common.
          shared='^(fuzzing/|\.github/workflows/fuzzing\.yml$|src/smda/[^/]+\.py$|src/smda/common/)'

          run_all=true
          changed=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"
            printf 'changed files:\n%s\n' "$changed"
            if ! grep -qE "$shared" <<<"$changed"; then
              run_all=false
            fi
          fi

          entries=""
          for spec in \
            "fuzz_loaders:binary:262144:^src/smda/utility/" \
            "fuzz_formats:formats:262144:^src/smda/utility/" \
            "fuzz_disassembler:binary:65536:^src/smda/(utility|intel|aarch64|cil|dalvik)/" \
            "fuzz_buffer:buffer:65536:^src/smda/(utility|intel|aarch64|cil|dalvik)/" \
            "fuzz_report:report:1048576:^src/smda/common/" \
            "fuzz_synthesis:synthesis:1048576:^src/smda/(synthesis|utility)/"; do
            IFS=':' read -r target profile max_len region <<<"$spec"
            if [ "$run_all" != true ] && ! grep -qE "$region" <<<"$changed"; then
              echo "skipping ${target}: nothing changed under ${region}"
              continue
            fi
            entries="${entries:+${entries},}{\"target\":\"${target}\",\"seed_profile\":\"${profile}\",\"max_len\":${max_len}}"
          done

          if [ -z "$entries" ]; then
            printf 'any=false\nmatrix={"include":[]}\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'any=true\nmatrix={"include":[%s]}\n' "$entries" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SMDA and atheris
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "atheris==${ATHERIS_VERSION}"

      - name: Record dependency versions
        # `pip install -e .` resolves the newest allowed capstone/lief, which can
        # differ from a developer's pinned environment; a finding must be
        # attributable to the versions that produced it.
        run: python -c "import capstone, lief; print('capstone', capstone.__version__); print('lief', lief.__version__)"

      - name: Restore accumulated corpus
        id: corpus-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # the cache evicts after 7 days without a hit, so a quiet fortnight would drop the
      # run back to bare seeds; the in-repo floor makes the starting state deterministic
      - name: Restore in-repo corpus floor
        env:
          TARGET: ${{ matrix.target }}
        run: python fuzzing/restore_corpus.py "${TARGET#fuzz_}" corpus

      - name: Generate seed corpus
        env:
          SEED_PROFILE: ${{ matrix.seed_profile }}
        run: python fuzzing/generate_seeds.py corpus --profile "$SEED_PROFILE"

      - name: Determine fuzzing duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SECONDS: ${{ inputs.max_total_time }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule) seconds=900 ;;
            workflow_dispatch)
              # Validate rather than interpolating a dispatch input into a shell
              # command, and keep it inside the job timeout.
              if [[ ! "$REQUESTED_SECONDS" =~ ^[0-9]{1,4}$ ]] || [ "$REQUESTED_SECONDS" -lt 10 ]; then
                echo "max_total_time must be an integer between 10 and 9999" >&2
                exit 1
              fi
              seconds="$REQUESTED_SECONDS"
              ;;
            *) seconds=120 ;;
          esac
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Run fuzz target
        env:
          MAX_TOTAL_TIME: ${{ steps.duration.outputs.seconds }}
          MAX_LEN: ${{ matrix.max_len }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python "fuzzing/${TARGET}.py" corpus \
            -dict=fuzzing/smda.dict \
            -max_total_time="${MAX_TOTAL_TIME}" \
            -max_len="${MAX_LEN}" \
            -timeout=60 \
            -rss_limit_mb=4096 \
            -malloc_limit_mb=2048 \
            -artifact_prefix=artifacts/ \
            -print_final_stats=1

      - name: Bound the cached corpus
        if: always()
        run: python fuzzing/prune_corpus.py corpus

      - name: Minimize crash artifacts
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Best effort: a smaller reproducer is what gets pinned as a
          # regression test. Never mask the original failure.
          shopt -s nullglob
          for artifact in artifacts/crash-* artifacts/oom-* artifacts/timeout-*; do
            python fuzzing/minimize.py "${TARGET#fuzz_}" "$artifact" || true
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore

      - name: Upload corpus for reproduction
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: corpus/
          if-no-files-found: ignore

      - name: Save accumulated corpus
        # Persist coverage progress even when the run failed, so the inputs that
        # led to a crash are not lost, and the next run starts warm. Cache
        # writes are unavailable to fork pull requests, which must not fail the job.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

  # The Python-level fuzzers only notice a memory error in capstone when it happens to
  # crash the process. This job rebuilds capstone with AddressSanitizer and libFuzzer
  # edge counters and runs the targets that feed it machine code, so an out-of-bounds
  # read in a decoder is reported where it happens and the fuzzer is also guided by
  # coverage inside capstone. lief is left uninstrumented: building it from source
  # takes longer than the fuzzing itself.
  fuzz_sanitized:
    name: Fuzz with ASan capstone (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.any == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz_buffer
            seed_profile: buffer
            max_len: 65536
          - target: fuzz_disassembler
            seed_profile: binary
            max_len: 65536

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install SMDA and atheris
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "atheris==${ATHERIS_VERSION}"

      - name: Restore accumulated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Add the corpus floor and seeds
        env:
          TARGET: ${{ matrix.target }}
          SEED_PROFILE: ${{ matrix.seed_profile }}
        run: |
          # these targets run about two inputs a second, and libFuzzer replays the whole
          # corpus before it mutates anything: a full cache (up to 5000 files) would use
          # the entire budget on replay, so only its smallest 400 files are kept here
          python fuzzing/prune_corpus.py corpus --max-files 400
          python fuzzing/restore_corpus.py "${TARGET#fuzz_}" corpus
          python fuzzing/generate_seeds.py corpus --profile "$SEED_PROFILE"

      - name: Rebuild capstone with AddressSanitizer
        # Same version pip resolved for SMDA. The library is compiled with ASan but
        # not linked against its runtime: the runtime comes from atheris'
        # asan_with_fuzzer.so via LD_PRELOAD, together with libFuzzer. From here on,
        # importing capstone without that preload fails, so this runs after the seeds.
        run: |
          set -euo pipefail
          # the distribution version: capstone.__version__ can lag behind it
          version="$(python -c 'from importlib.metadata import version; print(version("capstone"))')"
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,fuzzer-no-link -fno-omit-frame-pointer -g -O1" \
            python -m pip install --force-reinstall --no-deps --no-cache-dir --no-binary capstone "capstone==${version}"
          # found without importing capstone: the instrumented library only loads with
          # the sanitizer runtime preloaded
          library="$(python -c 'import glob, importlib.util, os; print(glob.glob(os.path.join(os.path.dirname(importlib.util.find_spec("capstone").origin), "lib", "libcapstone.so*"))[0])')"
          # an uninstrumented build would fuzz exactly as the main job does while
          # looking like it checks memory safety
          nm -D "$library" | grep -q " U __asan_report_load" || { echo "capstone is not ASan-instrumented" >&2; exit 1; }
          echo "capstone ${version} instrumented: ${library}"

      - name: Determine fuzzing duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SECONDS: ${{ inputs.max_total_time }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ ! "$REQUESTED_SECONDS" =~ ^[0-9]{1,4}$ ]] || [ "$REQUESTED_SECONDS" -lt 10 ]; then
              echo "max_total_time must be an integer between 10 and 9999" >&2
              exit 1
            fi
            seconds="$REQUESTED_SECONDS"
          else
            # includes the corpus replay, which takes several minutes
            seconds=1500
          fi
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Run fuzz target
        env:
          MAX_TOTAL_TIME: ${{ steps.duration.outputs.seconds }}
          MAX_LEN: ${{ matrix.max_len }}
          TARGET: ${{ matrix.target }}
          # Python itself leaks by design at exit, and the interpreter's allocator is
          # not instrumented; only capstone's memory errors are the point here
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          LD_PRELOAD="$(python -c 'import atheris; print(atheris.path())')/asan_with_fuzzer.so" \
          python "fuzzing/${TARGET}.py" corpus \
            -dict=fuzzing/smda.dict \
            -max_total_time="${MAX_TOTAL_TIME}" \
            -max_len="${MAX_LEN}" \
            -timeout=60 \
            -rss_limit_mb=4096 \
            -malloc_limit_mb=2048 \
            -artifact_prefix=artifacts/ \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-sanitized-artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
