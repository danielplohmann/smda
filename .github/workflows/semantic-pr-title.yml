name: Semantic PR Title

# pull_request_target is required to read the title of a PR from a fork, and is safe
# here specifically because this workflow never checks out or executes PR content -
# it runs one pinned action against the PR metadata with a read-only token.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches:
      - master
      - main

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            perf
            refactor
            test
            docs
            ci
            build
            chore
            revert
          scopes: |
            core
            intel
            aarch64
            dalvik
            cil
            common
            utility
            loaders
            labels
            report
            ida
            cli
            profiling
            tests
            ci
            build
            docs
