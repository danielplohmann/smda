name: Performance & Correctness Benchmark

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Fast fixture benchmark — the CI correctness/perf gate. Runs first so a broken
  # PR fails before we spin up the (slower) malpedia runner. Also resolves
  # whether the malpedia password is available, which gates the heavier jobs.
  fixture_gate:
    name: Fixture Benchmark Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      password_available: ${{ steps.check_password.outputs.available }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'master' }}
          path: base-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify benchmark imports
        run: |
          PYTHONPATH=base-repo/src python -c "import os, smda; expected = os.path.abspath('base-repo/src'); actual = os.path.abspath(smda.__file__); print('base smda:', actual); assert actual.startswith(expected + os.sep), f'Expected base smda from {expected}, got {actual} (editable install shadowing PYTHONPATH?)'"
          PYTHONPATH=src python -c "import os, smda; expected = os.path.abspath('src'); actual = os.path.abspath(smda.__file__); print('pr smda:', actual); assert actual.startswith(expected + os.sep), f'Expected PR smda from {expected}, got {actual} (editable install shadowing PYTHONPATH?)'"

      - name: Run counterbalanced benchmark passes
        # Base and PR were previously timed once each, base first. Any drift over the
        # job (a co-tenant VM ramping up, frequency scaling) therefore landed entirely
        # on the PR side. Running the passes in base/PR/PR/base order cancels linear
        # drift, and doubling the samples makes the per-fixture median far less
        # sensitive to a single slow iteration.
        run: |
          PYTHONPATH=base-repo/src python .github/workflows/scripts/run_perf_check.py --output base_results.json
          PYTHONPATH=src python .github/workflows/scripts/run_perf_check.py --output pr_results.json
          PYTHONPATH=src python .github/workflows/scripts/run_perf_check.py --output pr_results.json --append
          PYTHONPATH=base-repo/src python .github/workflows/scripts/run_perf_check.py --output base_results.json --append

      - name: Compare results
        run: |
          python .github/workflows/scripts/compare_perf.py pr_results.json base_results.json

      - name: Check Malpedia Password Availability
        id: check_password
        run: |
          if [ -n "$MALPEDIA_ZIP_PASSWORD" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          MALPEDIA_ZIP_PASSWORD: ${{ secrets.MALPEDIA_ZIP_PASSWORD }}

  # Malpedia disassembly. Both sides are timed here, in one job on one runner, in
  # base/PR/PR/base/base/PR order — the same reason the fixture gate above runs its
  # passes that way. The paired statistic compares the two sides file by file, so a
  # per-runner speed offset lands on it directly, and the noise band it is judged
  # against comes from repeated passes within a side, which cannot price a second
  # machine. Measured while the sides ran as separate legs: three consecutive runs
  # whose PR side produced identical output — same recovered functions, same two
  # differing files — reported +1.26%, -13.18% and -15.53%, because the PR side drew
  # a different runner each time (sum-of-best-times 252.83s, 282.21s, 289.04s) while
  # the base side, restored from cache, stayed bit-identical at 252.53s across all
  # three. Caching a side is what froze one end of that comparison: a restored side
  # is by construction a measurement from another machine and another hour.
  malpedia:
    name: Malpedia Benchmark
    needs: fixture_gate
    if: needs.fixture_gate.outputs.password_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'master' }}
          path: base-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify benchmark imports
        run: |
          PYTHONPATH=base-repo/src python -c "import os, smda; expected = os.path.abspath('base-repo/src'); actual = os.path.abspath(smda.__file__); print('base smda:', actual); assert actual.startswith(expected + os.sep), f'Expected base smda from {expected}, got {actual} (editable install shadowing PYTHONPATH?)'"
          PYTHONPATH=src python -c "import os, smda; expected = os.path.abspath('src'); actual = os.path.abspath(smda.__file__); print('pr smda:', actual); assert actual.startswith(expected + os.sep), f'Expected PR smda from {expected}, got {actual} (editable install shadowing PYTHONPATH?)'"

      - name: Decrypt Malpedia Samples
        run: |
          unzip -q -P "$MALPEDIA_ZIP_PASSWORD" .github/workflows/data/malpedia.zip -d malpedia_extracted
        env:
          MALPEDIA_ZIP_PASSWORD: ${{ secrets.MALPEDIA_ZIP_PASSWORD }}

      - name: Run counterbalanced benchmark passes
        run: |
          for spec in base:0 pr:0 pr:1 base:1 base:2 pr:2; do
            side="${spec%%:*}"
            index="${spec##*:}"
            if [ "$side" = base ]; then tree=base-repo/src; else tree=src; fi
            PYTHONPATH="$tree" python .github/workflows/scripts/process_malpedia.py \
              malpedia_extracted/malpedia "runtime_measurements/${side}_${index}"
          done

      - name: Upload base run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smda-base
          path: runtime_measurements/base_*
          if-no-files-found: error

      - name: Upload PR run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smda-pr
          path: runtime_measurements/pr_*
          if-no-files-found: error

  # Aggregate both sides, run the paired statistical evaluation, gate CI on
  # correctness/determinism, and publish the report.
  evaluate:
    name: Evaluate & Report
    needs: [fixture_gate, malpedia]
    if: needs.fixture_gate.outputs.password_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download benchmark runs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smda-*
          merge-multiple: true
          path: runtime_measurements

      # evaluate_runtime.py exits non-zero on a correctness regression (1) or
      # base/PR non-determinism (2); that failure gates CI. The reporting steps
      # below run regardless so the verdict is always published.
      - name: Evaluate Malpedia Runtime
        run: |
          python .github/workflows/scripts/evaluate_runtime.py

      - name: Publish Malpedia Results to Step Summary
        if: always()
        run: |
          if [ -f runtime_measurements/cache/evaluation.md ]; then
            cat runtime_measurements/cache/evaluation.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post PR Comment with Malpedia Results
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f runtime_measurements/cache/evaluation.md ]; then
            marker="<!-- smda-benchmark-evaluation-report -->"
            comment_body="$(printf '%s\n' "$marker"; cat runtime_measurements/cache/evaluation.md)"
            benchmark_comment_ids="$(
              gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                --jq ".[] | select(.user.login == \"github-actions[bot]\" and (((.body // \"\") | contains(\"$marker\")) or ((.body // \"\") | startswith(\"### 📊 SMDA Performance Evaluation Benchmark Results\")))) | .id"
            )"
            comment_id="$(printf '%s\n' "$benchmark_comment_ids" | tail -n 1)"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
                --raw-field body="$comment_body" >/dev/null
              printf '%s\n' "$benchmark_comment_ids" | sed '$d' | while read -r old_comment_id; do
                if [ -n "$old_comment_id" ]; then
                  gh api --method DELETE "repos/${{ github.repository }}/issues/comments/$old_comment_id" >/dev/null
                fi
              done
            else
              gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                --raw-field body="$comment_body" >/dev/null
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Malpedia Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: malpedia-evaluation-report
          path: |
            runtime_measurements/cache/evaluation.html
            runtime_measurements/cache/evaluation.json
            runtime_measurements/cache/evaluation.md
