repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.5
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # binary payloads: appending a newline or stripping a trailing 0x20 corrupts
      # an obfuscated corpus entry or a malware fixture rather than tidying it
      - id: trailing-whitespace
        exclude: &binary_payloads |
          (?x)^(
            data/apiscout_.*\.json
            |tests/[^/]*_xored
            |tests/fuzz_corpus/(?!README\.md).*
            |tests/fuzz_regressions/(?!README\.md).*
          )$
      - id: end-of-file-fixer
        exclude: *binary_payloads
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
        files: ^data/.*\.json$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=85000']
      - id: debug-statements
