[build-system]
requires = ["setuptools>=64.0.0,<84.1.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smda"
description = "A recursive disassmbler optimized for CFG recovery from memory dumps. Based on capstone."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD 2-Clause"}
authors = [
    {name = "Daniel Plohmann", email = "daniel.plohmann@mailbox.org"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dynamic = ["version"]
dependencies = [
    "capstone",
    "dncil",
    "dnfile",
    "lief>=0.16.0",
    "pycxxfilt>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/danielplohmann/smda"

[project.optional-dependencies]
dev = [
    "build",
    "diff-cover",
    "hypothesis",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    # pinned: ty is pre-1.0 and adds lint rules in patch releases, so an unpinned
    # floating version reddens unrelated PRs on someone else's release schedule
    # (0.0.69/0.0.70 added unsound-return-statement and unsound-yield, 35 errors
    # against an unchanged tree). Bump deliberately, with the new rules addressed.
    "ty==0.0.68",
    "tqdm",
    "twine",
]
ida = [
    "ida-domain>=0.5.0",
]
# Optional CPU/memory profiling toolkit (see profiling/). Kept out of `dev` so
# the default install stays lean. Install with: pip install -e ".[dev,profile]"
profile = [
    "py-spy",
    "memray",
    "line_profiler",
    "snakeviz",
    "psutil",
]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: without this an installed smda hands consumers (MCRIT included) zero types.
# Most of the surface is inferred rather than annotated; the public entry point in
# Disassembler.py is annotated explicitly, the model classes are a follow-up.
[tool.setuptools.package-data]
smda = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "smda.__version__"}

[tool.pytest.ini_options]
python_files = ["test*.py"]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "slow: disassembles a real fixture corpus; deselect with -m 'not slow' for a fast subset",
]
# A DeprecationWarning from LIEF or capstone on a new interpreter is exactly the signal
# the 3.14 matrix leg exists to surface, and it passed silently before this.
#
# The one exception: LIEF warns rather than raising when a Mach-O header carries a
# cpu_type outside its enum, which is precisely the malformed input the Mach-O readers
# are expected to survive. Suppressing it belongs here and not in src/ - warnings.
# catch_warnings() mutates the process-wide filter list, so a library doing it is not
# thread-safe for consumers.
filterwarnings = [
    "error",
    "ignore:[0-9]+ is not a valid CPU_TYPE:RuntimeWarning",
]

[tool.coverage.run]
branch = true
source = ["smda"]
# BatchProcessor executes in worker processes; without this their lines read as
# uncovered even though tests exercise them
concurrency = ["multiprocessing"]
parallel = true
sigterm = true
omit = [
    "*/lib/*",
    "capstone/*",
    "*distutils/*",
    "ctypes/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def main\\(argv\\):",
]
# ignore_errors is deliberately unset: a file coverage cannot read should fail the run
fail_under = 75

[tool.coverage.html]
directory = "coverage-html"

[tool.ruff]
# Same as Black.
line-length = 120

# Assume Python 3.11+
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "W",
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "UP006",  # Keep existing typing aliases without broad modernization churn
    "UP007",  # Keep existing Optional/Union annotations without broad modernization churn
    "UP017",  # Keep existing timezone spelling without broad modernization churn
    "UP035",  # Keep existing typing imports without broad modernization churn
    "UP045",  # Keep existing Optional annotations without broad modernization churn
]

[tool.ruff.lint.isort]
known-first-party = ["smda"]

[tool.ty]

[tool.ty.rules]
# Style-only rules: not worth 100+ source changes
missing-override-decorator = "ignore"
missing-type-argument = "ignore"
# Third-party noise: LIEF's dynamic attributes
unresolved-attribute = "warn"
all = "error"

[tool.ty.terminal]
error-on-warning = false

[[tool.ty.overrides]]
include = ["src/smda/utility/PeFileLoader.py"]
rules = { "unresolved-attribute" = "ignore" }

[[tool.ty.overrides]]
include = ["src/smda/utility/ElfFileLoader.py"]
rules = { "unresolved-attribute" = "ignore" }

# IDA code paths: cannot be statically typed (IDA SDK dynamic dispatch)
[[tool.ty.overrides]]
include = ["src/smda/ida/"]
rules = { all = "warn" }

# LIEF/dnfile dynamic attribute dispatch: type info unknown to ty
[[tool.ty.overrides]]
include = ["src/smda/aarch64/analyzers.py"]
rules = { "invalid-assignment" = "ignore" }

[[tool.ty.overrides]]
include = ["src/smda/dalvik/DalvikDisassembler.py"]
rules = { "invalid-assignment" = "ignore", "not-iterable" = "ignore" }

[[tool.ty.overrides]]
include = ["src/smda/cil/CilDisassembler.py"]
rules = { "invalid-assignment" = "ignore", "not-iterable" = "ignore" }

# LIEF's type stubs declare PE Section.name as bytes; the runtime returns str.
[[tool.ty.overrides]]
include = ["src/smda/synthesis/PeSynthesizer.py"]
rules = { "invalid-argument-type" = "ignore" }

# The pdbparse dependency is optional; suppress unresolved-import for it
[[tool.ty.overrides]]
include = ["src/smda/common/labelprovider/PdbSymbolProvider.py"]
rules = { "unresolved-import" = "ignore" }

# atheris is installed only in the fuzzing CI job, and targets.py is deliberately
# importable without it so the regression replay path works in the normal test run
[[tool.ty.overrides]]
include = ["fuzzing/harness.py"]
rules = { "unresolved-import" = "ignore" }

# pstats.Stats exposes total_calls/prim_calls at runtime, but typeshed does not
# declare them; the heterogeneous fixture dicts likewise defeat os.path.join's overloads
[[tool.ty.overrides]]
include = [".github/workflows/scripts/run_perf_check.py"]
rules = { "unresolved-attribute" = "ignore", "no-matching-overload" = "ignore" }

# the profile extra is deliberately kept out of dev to keep the default install lean,
# so its imports are expected to be missing in a dev-only environment like the lint job
[[tool.ty.overrides]]
include = ["profiling/"]
rules = { "unresolved-import" = "ignore" }
